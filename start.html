<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Claw健身教练 - 启动页面</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, 'Helvetica Neue', Arial, sans-serif;
            background: linear-gradient(135deg, #1a1a2e 0%, #16213e 100%);
            color: #ffffff;
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
            padding: 20px;
        }

        .container {
            max-width: 600px;
            width: 100%;
            text-align: center;
        }

        .logo {
            font-size: 4rem;
            margin-bottom: 20px;
            animation: bounce 2s infinite;
        }

        @keyframes bounce {
            0%, 100% { transform: translateY(0); }
            50% { transform: translateY(-10px); }
        }

        h1 {
            font-size: 2.5rem;
            color: #00d4ff;
            margin-bottom: 10px;
            text-shadow: 0 0 20px rgba(0, 212, 255, 0.5);
        }

        .subtitle {
            font-size: 1.2rem;
            color: #a0a0a0;
            margin-bottom: 30px;
        }

        .intro {
            background: rgba(255, 255, 255, 0.05);
            padding: 20px;
            border-radius: 15px;
            margin-bottom: 30px;
            text-align: left;
        }

        .intro h2 {
            color: #00d4ff;
            margin-bottom: 15px;
            font-size: 1.3rem;
        }

        .intro ul {
            list-style: none;
            padding-left: 0;
        }

        .intro li {
            padding: 8px 0;
            padding-left: 25px;
            position: relative;
            color: #c0c0c0;
        }

        .intro li::before {
            content: "💪";
            position: absolute;
            left: 0;
        }

        .btn-group {
            display: flex;
            gap: 15px;
            flex-wrap: wrap;
            justify-content: center;
        }

        .btn {
            padding: 15px 30px;
            border: none;
            border-radius: 10px;
            font-size: 1.1rem;
            font-weight: bold;
            cursor: pointer;
            transition: all 0.3s ease;
            text-decoration: none;
            display: inline-block;
        }

        .btn-primary {
            background: linear-gradient(135deg, #00d4ff, #0099cc);
            color: #1a1a2e;
        }

        .btn-primary:hover {
            transform: translateY(-3px);
            box-shadow: 0 5px 20px rgba(0, 212, 255, 0.4);
        }

        .btn-secondary {
            background: rgba(255, 255, 255, 0.1);
            color: #ffffff;
            border: 2px solid rgba(255, 255, 255, 0.2);
        }

        .btn-secondary:hover {
            background: rgba(255, 255, 255, 0.2);
            transform: translateY(-3px);
        }

        .tips {
            margin-top: 30px;
            padding: 20px;
            background: rgba(255, 107, 107, 0.1);
            border-radius: 10px;
            border-left: 4px solid #ff6b6b;
        }

        .tips h3 {
            color: #ff6b6b;
            margin-bottom: 10px;
        }

        .tips p {
            color: #c0c0c0;
            font-size: 0.9rem;
            line-height: 1.5;
        }

        .footer {
            margin-top: 30px;
            color: #a0a0a0;
            font-size: 0.9rem;
        }

        @media (max-width: 600px) {
            .logo {
                font-size: 3rem;
            }

            h1 {
                font-size: 2rem;
            }

            .btn-group {
                flex-direction: column;
            }

            .btn {
                width: 100%;
            }
        }
    </style>
</head>
<body>
    <div class="container">
        <div class="logo">💪</div>
        <h1>Claw健身教练</h1>
        <p class="subtitle">你的私人健身助手</p>

        <div class="intro">
            <h2>欢迎开始你的健身之旅！</h2>
            <ul>
                <li>专为初级健身者设计</li>
                <li>每周3-4次训练，每次30-45分钟</li>
                <li>3个月渐进式训练计划</li>
                <li>记录训练数据，动态调整计划</li>
            </ul>
        </div>

        <div class="btn-group">
            <a href="index.html" class="btn btn-primary">开始训练 🚀</a>
            <a href="plan-guide.html" class="btn btn-secondary">查看计划说明 📖</a>
        </div>

        <div class="tips">
            <h3>⚠️ 重要提示</h3>
            <p>在开始任何新的锻炼计划前，请咨询医生。训练时如有不适，请立即停止。保持正确的姿势比增加重量更重要。</p>
        </div>

        <div class="footer">
            <p>© 2026 Claw健身教练 | 你的健身伙伴</p>
        </div>
    </div>

    <script>
        // 简单的语言切换功能 - 只支持中英文
        const languages = {
            'zh-CN': '中文',
            'en': 'English'
        };

        function toggleLanguage() {
            const currentLang = localStorage.getItem('clawFitnessLanguage') || 'zh-CN';
            const langKeys = Object.keys(languages);
            const currentIndex = langKeys.indexOf(currentLang);
            const nextIndex = (currentIndex + 1) % langKeys.length;
            const nextLang = langKeys[nextIndex];
            
            localStorage.setItem('clawFitnessLanguage', nextLang);
            alert('语言已切换为: ' + languages[nextLang]);
        }
    </script>
</body>
</html>
